<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist — Setup A / A+</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 32px 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eef2f6 0%, #f8fafc 100%);
  color: #17202a;
}

.card {
  max-width: 820px;
  margin: auto;
  background: #fff;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 12px 35px rgba(15,23,42,.10);
}

h1 {
  margin: 0 0 24px;
  font-size: 25px;
  text-align: center;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
}

th, td {
  padding: 14px 16px;
  border-bottom: 1px solid #e5e7eb;
}

th {
  background: #f8fafc;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: #667085;
}

th:not(:first-child), td.status {
  text-align: center;
  width: 100px;
}

tr:last-child td { border-bottom: none; }

td:first-child {
  font-weight: 600;
}

.common {
  background: #f8fafc;
}

.section td {
  padding: 9px 16px;
  background: #17202a;
  color: white;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .7px;
  border-bottom: none;
}

button {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 24px;
  width: 48px;
  height: 38px;
  border-radius: 9px;
  transition: transform .1s, background .15s;
}

button:hover {
  background: #f0f2f5;
  transform: scale(1.06);
}

.result {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.result-box {
  flex: 1;
  text-align: center;
  padding: 15px 10px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: #fafafa;
}

.result-title {
  font-size: 12px;
  color: #667085;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 5px;
}

.result-value {
  font-size: 21px;
  font-weight: 700;
}

.a-active {
  color: #15803d;
}

.aplus-active {
  color: #7c3aed;
}

.none {
  color: #98a2b3;
}

.footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 15px;
}

.reset {
  background: #17202a;
  color: white;
  border-radius: 9px;
  padding: 9px 15px;
  font-size: 13px;
  width: auto;
  height: auto;
}

.reset:hover {
  background: #344054;
  transform: none;
}

.note {
  margin-top: 13px;
  font-size: 12px;
  color: #667085;
  line-height: 1.5;
  text-align: center;
}

@media (max-width: 600px) {
  .card { padding: 18px; }
  th, td { padding: 12px 9px; }
  th:not(:first-child), td.status { width: 72px; }
  .result { flex-direction: column; }
}
</style>
</head>

<body>
<div class="card">
  <h1>Checklist — Setup A / A+</h1>

  <table>
    <thead>
      <tr>
        <th>Condição</th>
        <th>Estado</th>
      </tr>
    </thead>

    <tbody id="checklist"></tbody>
  </table>

  <div class="result">
    <div class="result-box">
      <div class="result-title">Setup</div>
      <div id="setupResult" class="result-value none">—</div>
    </div>
    <div class="result-box">
      <div class="result-title">Condições</div>
      <div id="countResult" class="result-value">0/9</div>
    </div>
  </div>

  <div class="footer">
    <button class="reset" onclick="resetChecklist()">Reset</button>
  </div>

  <div class="note">
    ⬜ não definido &nbsp; · &nbsp; ✅ a favor &nbsp; · &nbsp; ❌ contra
  </div>
</div>

<script>
const common = [
  "Bias/Neutro a favor",
  "Volume a favor",
  "Absorção ou Exaustão"
];

const aOnly = [
  "Low/High Protegido",
  "1-2 Confluências",
  "Área de Interesse"
];

const aPlusOnly = [
  "Low/High Perfeito",
  "Recompensa a favor",
  "Área de Interesse HTF"
];

const items = [...common, ...aOnly, ...aPlusOnly];

let current = JSON.parse(localStorage.getItem("setupChecklist")) || Array(items.length).fill(0);

function addRow(tbody, label, index, extraClass = "") {
  const tr = document.createElement("tr");
  if (extraClass) tr.className = extraClass;

  tr.innerHTML = `
    <td>${label}</td>
    <td class="status">
      <button onclick="toggle(${index})" aria-label="Alterar estado">${stateEmoji(current[index])}</button>
    </td>
  `;

  tbody.appendChild(tr);
}

function addSection(tbody, title) {
  const tr = document.createElement("tr");
  tr.className = "section";
  tr.innerHTML = `<td colspan="2">${title}</td>`;
  tbody.appendChild(tr);
}

function stateEmoji(state) {
  return ["⬜", "✅", "❌"][state];
}

function render() {
  const tbody = document.getElementById("checklist");
  tbody.innerHTML = "";

  addSection(tbody, "Condições comuns");
  common.forEach((label, i) => addRow(tbody, label, i, "common"));

  addSection(tbody, "Setup A");
  aOnly.forEach((label, i) => addRow(tbody, label, common.length + i));

  addSection(tbody, "Setup A+");
  aPlusOnly.forEach((label, i) =>
    addRow(tbody, label, common.length + aOnly.length + i)
  );

  updateResult();
  localStorage.setItem("setupChecklist", JSON.stringify(current));
}

function toggle(i) {
  current[i] = (current[i] + 1) % 3;
  render();
}

function isPositive(i) {
  return current[i] === 1;
}

function setupA() {
  // Common + A-specific conditions
  return [0,1,2,3,4,5].every(isPositive);
}

function setupAPlus() {
  // Common + A+ specific conditions
  return [0,1,2,6,7,8].every(isPositive);
}

function updateResult() {
  const a = setupA();
  const ap = setupAPlus();

  const result = document.getElementById("setupResult");

  if (ap) {
    result.textContent = "A+";
    result.className = "result-value aplus-active";
  } else if (a) {
    result.textContent = "A";
    result.className = "result-value a-active";
  } else {
    result.textContent = "—";
    result.className = "result-value none";
  }

  const positive = current.filter(isPositive).length;
  document.getElementById("countResult").textContent = `${positive}/9`;
}

function resetChecklist() {
  current = Array(items.length).fill(0);
  render();
}

render();
</script>
</body>
</html>
